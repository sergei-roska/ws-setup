#!/usr/bin/env bash
# Custom .bashrc configuration - prompt styling, aliases, and PATH settings

# === History Configuration ===
HISTCONTROL=ignoreboth
HISTSIZE=1000
HISTFILESIZE=2000

# === Shell Options ===
SHELL_OPTS=(
  "histappend"      # Append to history file
  "checkwinsize"    # Update LINES and COLUMNS after each command
)

# === PATH Additions (order matters) ===
declare -a PATH_ADDITIONS=(
  "$HOME/.lando/bin"
  "$HOME/.config/composer/vendor/bin"
  "$HOME/.opencode/bin"
  "$HOME/.local/bin"
)

# === Aliases ===
declare -A BASH_ALIASES=(
  # ls aliases
  [ll]="ls -alF"
  [la]="ls -A"
  [l]="ls -CF"

  # grep aliases
  [grep]="grep --color=auto"
  [fgrep]="fgrep --color=auto"
  [egrep]="egrep --color=auto"

  # Git aliases
  [gs]="git status"
  [gl]="git log --oneline"
  [gp]="git pull"

  # Dev environment aliases
  [ddev-up]="ddev start && ddev ssh"
  [lando-up]="lando start && lando ssh"

  # Workflow aliases (ws-knowledge)
  [wf-start]="$HOME/Projects/Workspace/ws-knowledge/workflows/feature-start.sh"
  [wf-sync]="$HOME/Projects/Workspace/ws-knowledge/workflows/sync-main.sh"
  [wf-deploy]="$HOME/Projects/Workspace/ws-knowledge/workflows/drupal-deploy.sh"
  [wf-cex]="$HOME/Projects/Workspace/ws-knowledge/workflows/config-export.sh"
  [wf-build]="$HOME/Projects/Workspace/ws-knowledge/workflows/theme-build.sh"
  [wf-core]="$HOME/Projects/Workspace/ws-knowledge/workflows/core-update.sh"
  [wf-push]="$HOME/Projects/Workspace/ws-knowledge/workflows/feature-push.sh"
  [wf-phpcs]="$HOME/Projects/Workspace/ws-knowledge/workflows/phpcs-check.sh"
  [wf-audit]="$HOME/Projects/Workspace/ws-knowledge/workflows/security-audit.sh"
  [wf-dbreset]="$HOME/Projects/Workspace/ws-knowledge/workflows/db-reset.sh"
)

# === Prompt Configuration ===
ENABLE_GIT_PROMPT=true
ENABLE_COLORED_PROMPT=true

# Color codes for prompt
PROMPT_COLOR_RESET='\[\033[00m\]'
PROMPT_COLOR_USER_HOST='\[\033[01;32m\]'
PROMPT_COLOR_PATH_PREFIX='\[\033[38;5;250m\]'
PROMPT_COLOR_PATH_LEAF='\[\033[38;5;117m\]'
PROMPT_COLOR_GIT_AMBER='\[\033[38;5;214m\]'
PROMPT_COLOR_GIT_RED='\[\033[01;31m\]'

# === Environment Variables ===
declare -A BASH_EXPORTS=(
  [NVM_DIR]="$HOME/.nvm"
  [WF_DIR]="$HOME/Projects/Workspace/ws-knowledge/workflows"
)

# === Homebrew (Linux) ===
ENABLE_HOMEBREW=true
HOMEBREW_BIN="/home/linuxbrew/.linuxbrew/bin/brew"

# === Completion ===
ENABLE_BASH_COMPLETION=true
